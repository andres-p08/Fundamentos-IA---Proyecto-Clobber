
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chatbot de películas</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main>
        <h1>Chatbot de películas</h1>
        <p>Nemotron 2 + SWI-Prolog</p>

        <section id="acceso">
            <h2>Iniciar chatbot</h2>
            <p>Introduce tu propia API Key de OpenRouter.</p>

            <form id="formulario-clave" autocomplete="off">
                <input
                    id="clave"
                    type="password"
                    placeholder="API Key de OpenRouter"
                    autocomplete="off"
                    spellcheck="false"
                    required
                    maxlength="256"
                >
                <button type="submit">Iniciar</button>
            </form>

            <p>
                La clave se utiliza durante esta sesión
                y no se guarda en el servidor.
            </p>
        </section>

        <section id="chat" hidden>
            <div id="conversacion" aria-live="polite"></div>

            <form id="formulario">
                <input
                    id="pregunta"
                    type="text"
                    placeholder="Escribe una pregunta..."
                    maxlength="400"
                    required
                >
                <button id="enviar" type="submit">Enviar</button>
            </form>

            <p id="estado"></p>
            <button id="salir" type="button">Cerrar sesión</button>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
